<script type="module">
  /**
   * Scene3D.html — 黏土風 3D 島嶼場景（Three.js）
   *
   * 對外 API（window.ClayWorld）：
   *   init(container, labelLayer, { onQuestEnter(id), onQuestLeave(id), onAvatarClick() })
   *   setData({ assignments, profile, email })  重建任務小屋；依 email 產生專屬角色
   *   celebrate(levelUp)                  角色跳躍 + 彩紙
   *   walkToQuest(id)                     角色自動走到該任務的門口
   *   avatarLook(email)                   取得某 email 對應的角色外觀（HUD 用）
   *
   * 操作：WASD / 方向鍵移動、點地面走過去、點小屋（或標籤）會走到門口；
   * 角色站上門口的地墊時觸發 onQuestEnter，離開時觸發 onQuestLeave。
   * 載入完成時觸發 window 的 'clayworld-ready' 事件；失敗時觸發 'clayworld-failed'。
   */
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

  const PALETTE = {
    grass: '#b9e3a5', grassDark: '#9fd38c', soil: '#f2c79d', soilDark: '#e3ad7f',
    cream: '#fff3dc', wood: '#c99a72', window: '#bfe6ff',
    roofs: ['#ff9fb6', '#9fd2ff', '#ffd27d', '#c7a8ff', '#8fe3cf', '#ffb38a'],
    caps: ['#ff8f8f', '#ffb3d1', '#b59cff', '#7fd6c2'],
    avatar: '#ffd7bf', blush: '#ff9eb3', ink: '#3d3247',
    gold: '#ffd166', mint: '#7fdcb4', orange: '#ff9f43', grey: '#d6d0d8',
    leaves: ['#a6dd8f', '#8fd19e', '#c3e88d', '#9ed9b8'],
    flowers: ['#ffb3c7', '#fff07a', '#c9b3ff', '#ffffff', '#ffc89e'],
    confetti: ['#ff9fb6', '#9fd2ff', '#ffd27d', '#c7a8ff', '#8fe3cf', '#ffb38a']
  };
  const ISLAND_R = 7.5;
  const MOUND = 0.16; // 島面隆起比例

  const WALK_SPEED = 3.4;      // 每秒移動距離（島嶼座標）
  const AVATAR_R = 0.5;        // 角色碰撞半徑
  const PAD_TRIGGER = 0.6;     // 站上門口地墊的判定半徑
  const WALK_LIMIT = ISLAND_R - 0.9;

  let renderer, scene, camera, clock, raycaster, pointer;
  let container, labelLayer, callbacks = {};
  let island, islandTop, questLayer, decoLayer, avatar, avatarParts = {}, clouds = [];
  let quests = []; // { id, group, marker, label, hover, closed, pad, padX, padZ }
  let questObstacles = [], decoObstacles = []; // { x, z, r }
  let confetti = [];
  let clayBump = null;
  let targetRing = null;
  const matCache = {};

  // 角色移動狀態（島嶼座標）
  const player = {
    x: 0, z: 0.4, target: null, path: null, targetQuest: null,
    moving: false, lastMove: -10, walkPhase: 0, stuck: 0, zone: null
  };
  const keys = {};

  // 鏡頭（球座標，繞著角色轉）
  const cam = { theta: 0.35, phi: 0.98, radius: 13, tTheta: 0.35, tPhi: 0.98, tRadius: 13 };
  const camTarget = new THREE.Vector3(0, 0.6, 0);
  let drag = null;
  const pinch = { active: false, dist: 0 };

  // ---------- 工具 ----------

  function seeded(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  function makeClayBump() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(size, size);
    const rnd = seeded(7);
    for (let i = 0; i < size * size; i++) {
      const v = 128 + (rnd() - 0.5) * 60;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    // 柔化，做出黏土指紋般的細微凹凸
    ctx.filter = 'blur(1.5px)';
    ctx.drawImage(c, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2, 2);
    return tex;
  }

  function clay(color, opts) {
    const key = color + JSON.stringify(opts || {});
    if (matCache[key]) return matCache[key];
    const m = new THREE.MeshStandardMaterial(Object.assign({
      color: color,
      roughness: 0.82,
      metalness: 0,
      bumpMap: clayBump,
      bumpScale: 0.35
    }, opts || {}));
    matCache[key] = m;
    return m;
  }

  function mesh(geom, color, opts) {
    const m = new THREE.Mesh(geom, clay(color, opts));
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  function sphere(r, color, seg) {
    return mesh(new THREE.SphereGeometry(r, seg || 24, Math.round((seg || 24) * 0.75)), color);
  }

  /** 點到線段 {x1,z1,x2,z2} 的距離 */
  function distToSegment(x, z, s) {
    const vx = s.x2 - s.x1, vz = s.z2 - s.z1;
    const len2 = vx * vx + vz * vz || 1;
    const t = Math.max(0, Math.min(1, ((x - s.x1) * vx + (z - s.z1) * vz) / len2));
    const dx = x - (s.x1 + vx * t), dz = z - (s.z1 + vz * t);
    return Math.sqrt(dx * dx + dz * dz);
  }

  /** 字串雜湊（FNV-1a），讓同一個 email 永遠得到同一個角色 */
  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  /** 島面高度（隆起的枕頭形） */
  function groundY(x, z) {
    const r2 = (x * x + z * z) / (ISLAND_R * ISLAND_R);
    return r2 >= 1 ? 0 : MOUND * ISLAND_R * Math.sqrt(1 - r2);
  }

  // ---------- 場景建立 ----------

  function buildIsland() {
    island = new THREE.Group();
    scene.add(island);

    const top = sphere(ISLAND_R, PALETTE.grass, 64);
    top.scale.set(1, MOUND, 1);
    island.add(top);
    islandTop = top;

    const soil1 = sphere(ISLAND_R * 0.97, PALETTE.soil, 48);
    soil1.scale.set(1, 0.42, 1);
    soil1.position.y = -2.6;
    island.add(soil1);

    const soil2 = sphere(ISLAND_R * 0.62, PALETTE.soilDark, 40);
    soil2.scale.set(1, 0.55, 1);
    soil2.position.y = -4.3;
    island.add(soil2);

    const soil3 = sphere(ISLAND_R * 0.28, PALETTE.soilDark, 24);
    soil3.scale.set(1, 0.9, 1);
    soil3.position.y = -6.0;
    island.add(soil3);

    // 側面小石頭
    const rnd = seeded(42);
    for (let i = 0; i < 10; i++) {
      const a = rnd() * Math.PI * 2;
      const r = ISLAND_R * (0.86 + rnd() * 0.06);
      const rock = sphere(0.3 + rnd() * 0.35, i % 2 ? '#e9d6c3' : '#d9c2b0', 16);
      rock.scale.y = 0.7;
      rock.position.set(Math.cos(a) * r, -1.0 - rnd() * 0.6, Math.sin(a) * r);
      island.add(rock);
    }

    questLayer = new THREE.Group();
    decoLayer = new THREE.Group();
    island.add(questLayer);
    island.add(decoLayer);
  }

  function buildTree(x, z, rnd) {
    const g = new THREE.Group();
    const trunk = mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.7, 12), PALETTE.wood);
    trunk.position.y = 0.35;
    g.add(trunk);
    const leafColor = PALETTE.leaves[Math.floor(rnd() * PALETTE.leaves.length)];
    const sizes = [0.55, 0.42, 0.3];
    let y = 0.85;
    sizes.forEach(function (s) {
      const ball = sphere(s, leafColor, 20);
      ball.position.y = y;
      g.add(ball);
      y += s * 0.9;
    });
    const sc = 0.8 + rnd() * 0.5;
    g.scale.setScalar(sc);
    g.position.set(x, groundY(x, z) - 0.05, z);
    g.userData.sway = rnd() * Math.PI * 2;
    g.userData.obstacleR = 0.3 * sc;
    return g;
  }

  function buildBush(x, z, rnd) {
    const g = new THREE.Group();
    const color = PALETTE.leaves[Math.floor(rnd() * PALETTE.leaves.length)];
    [[0, 0.25, 0, 0.32], [0.28, 0.18, 0.05, 0.24], [-0.25, 0.17, -0.05, 0.22]].forEach(function (p) {
      const b = sphere(p[3], color, 16);
      b.position.set(p[0], p[1], p[2]);
      g.add(b);
    });
    // 小花
    if (rnd() > 0.4) {
      const f = sphere(0.07, PALETTE.flowers[Math.floor(rnd() * PALETTE.flowers.length)], 10);
      f.position.set(0.05, 0.56, 0.12);
      g.add(f);
    }
    g.position.set(x, groundY(x, z) - 0.05, z);
    g.rotation.y = rnd() * Math.PI;
    g.userData.obstacleR = 0.4;
    return g;
  }

  function buildFlower(x, z, rnd) {
    const g = new THREE.Group();
    const stem = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 6), PALETTE.grassDark);
    stem.position.y = 0.15;
    g.add(stem);
    const color = PALETTE.flowers[Math.floor(rnd() * PALETTE.flowers.length)];
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      const petal = sphere(0.06, color, 8);
      petal.position.set(Math.cos(a) * 0.07, 0.32, Math.sin(a) * 0.07);
      g.add(petal);
    }
    const center = sphere(0.05, '#ffd56b', 8);
    center.position.y = 0.33;
    g.add(center);
    g.position.set(x, groundY(x, z) - 0.02, z);
    return g;
  }

  function buildDecorations(occupied, paths) {
    while (decoLayer.children.length) decoLayer.remove(decoLayer.children[0]);
    decoObstacles = [];
    const rnd = seeded(2024);
    paths = paths || [];
    function free(x, z, minDist, solid) {
      if (x * x + z * z < 2.2 * 2.2) return false; // 中央廣場
      if (solid) {
        // 樹叢不要擋住角色或通往門口的小路
        const ax = x - player.x, az = z - player.z;
        if (ax * ax + az * az < 1.4 * 1.4) return false;
        if (paths.some(function (s) { return distToSegment(x, z, s) < 0.9; })) return false;
      }
      return occupied.every(function (p) {
        const dx = p.x - x, dz = p.z - z;
        return dx * dx + dz * dz > minDist * minDist;
      });
    }
    function place(count, minDist, builder) {
      let tries = 0, made = 0;
      while (made < count && tries < count * 30) {
        tries++;
        const a = rnd() * Math.PI * 2;
        const r = 2.4 + rnd() * (ISLAND_R - 3.2);
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        if (!free(x, z, minDist, builder !== buildFlower)) continue;
        const d = builder(x, z, rnd);
        decoLayer.add(d);
        if (d.userData.obstacleR) decoObstacles.push({ x: x, z: z, r: d.userData.obstacleR });
        occupied.push({ x: x, z: z });
        made++;
      }
    }
    place(6, 1.4, buildTree);
    place(9, 0.9, buildBush);
    place(26, 0.35, buildFlower);
  }

  function buildCloud(rnd) {
    const g = new THREE.Group();
    const n = 4 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const s = 0.5 + rnd() * 0.5;
      const puff = sphere(s, '#ffffff', 16);
      puff.material = clay('#ffffff', { roughness: 0.95 });
      puff.castShadow = false;
      puff.position.set((i - n / 2) * 0.6, rnd() * 0.3, (rnd() - 0.5) * 0.5);
      g.add(puff);
    }
    return g;
  }

  function buildClouds() {
    const rnd = seeded(99);
    for (let i = 0; i < 7; i++) {
      const c = buildCloud(rnd);
      c.userData = { angle: rnd() * Math.PI * 2, radius: 8.5 + rnd() * 3, y: -2.5 - rnd() * 2.5, speed: 0.02 + rnd() * 0.03 };
      c.scale.setScalar(0.7 + rnd() * 0.3);
      clouds.push(c);
      scene.add(c);
    }
  }

  // ---------- 角色 ----------

  const AVATAR_COLORS = [
    '#ffd7bf', '#ffc2d1', '#c9e4ff', '#d7c8ff', '#bff0d4', '#fff0a8',
    '#ffcfa3', '#eadfd6', '#b8e8f0', '#f7c6e6', '#d4f0a8', '#ffb8b0'
  ];
  const CHEEK_COLORS = ['#ff9eb3', '#ff8f8f', '#ffb38a', '#f7a1d0'];

  /** 由 email 決定角色外觀：同一個 email 永遠一樣，不同人各不相同 */
  function avatarLook(email) {
    const key = String(email || 'guest').trim().toLowerCase();
    const rnd = seeded(hashString(key));
    rnd(); rnd(); // 打散前幾個值
    function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
    const body = pick(AVATAR_COLORS);
    let accent = pick(PALETTE.roofs);
    if (accent === body) accent = PALETTE.roofs[(PALETTE.roofs.indexOf(accent) + 2) % PALETTE.roofs.length];
    return {
      key: key,
      body: body,
      accent: accent,
      cheek: pick(CHEEK_COLORS),
      ears: pick(['none', 'cat', 'bear', 'bunny', 'antenna', 'horns', 'tuft']),
      eyes: pick(['dot', 'oval', 'happy', 'sparkle']),
      mouth: pick(['smile', 'smile', 'open', 'cat']),
      pattern: pick(['none', 'belly', 'spots', 'band']),
      tail: pick(['none', 'ball', 'curl']),
      size: 0.8 + rnd() * 0.12,
      squash: 0.86 + rnd() * 0.14
    };
  }

  function tint(color, toward, k) {
    return '#' + new THREE.Color(color).lerp(new THREE.Color(toward), k).getHexString();
  }

  function buildAvatar() {
    avatar = new THREE.Group();
    avatar.userData.isAvatar = true;
    island.add(avatar);
    applyLook(avatarLook(''));
    avatar.position.set(player.x, groundY(player.x, player.z) - 0.05, player.z);
  }

  /** 依外觀重建角色身體（保留位置、朝向與等級配件） */
  function applyLook(look) {
    if (avatarParts.body) avatar.remove(avatarParts.body);
    const body = new THREE.Group(); // 擠壓伸展用
    avatar.add(body);
    const skin = look.body;
    const shade = tint(skin, '#7a5a8a', 0.18);

    const blob = sphere(0.78, skin, 40);
    blob.scale.set(1, look.squash, 1);
    blob.position.y = 0.72;
    body.add(blob);
    const topY = 0.72 + 0.78 * look.squash; // 頭頂高度

    const face = new THREE.Group();
    face.position.set(0, 0.8, 0);
    body.add(face);

    // 眼睛
    const eyes = [];
    [-1, 1].forEach(function (s) {
      const eye = new THREE.Group();
      if (look.eyes === 'happy') {
        const arc = mesh(new THREE.TorusGeometry(0.075, 0.024, 8, 16, Math.PI), PALETTE.ink);
        arc.position.y = -0.03;
        eye.add(arc);
      } else {
        const big = look.eyes === 'sparkle' ? 0.11 : 0.085;
        const ball = sphere(big, PALETTE.ink, 16);
        ball.scale.set(1, look.eyes === 'oval' ? 1.55 : 1.2, 0.6);
        eye.add(ball);
        const shine = sphere(look.eyes === 'sparkle' ? 0.036 : 0.028, '#ffffff', 8);
        shine.position.set(0.028, 0.04, 0.05);
        eye.add(shine);
        if (look.eyes === 'sparkle') {
          const shine2 = sphere(0.018, '#ffffff', 8);
          shine2.position.set(-0.03, -0.035, 0.05);
          eye.add(shine2);
        }
      }
      eye.position.set(0.24 * s, 0.08, 0.7);
      face.add(eye);
      eyes.push(eye);

      const blush = sphere(0.12, look.cheek, 16);
      blush.scale.set(1, 0.55, 0.3);
      blush.position.set(0.42 * s, -0.08, 0.6);
      face.add(blush);
    });

    // 嘴巴
    if (look.mouth === 'open') {
      const m = sphere(0.07, '#d9576f', 12);
      m.scale.set(1, 0.8, 0.4);
      m.position.set(0, -0.08, 0.73);
      face.add(m);
    } else if (look.mouth === 'cat') {
      [-1, 1].forEach(function (s) {
        const w = mesh(new THREE.TorusGeometry(0.045, 0.018, 8, 12, Math.PI), PALETTE.ink);
        w.rotation.z = Math.PI;
        w.position.set(0.045 * s, -0.05, 0.74);
        face.add(w);
      });
    } else {
      const mouth = mesh(new THREE.TorusGeometry(0.07, 0.022, 8, 16, Math.PI), PALETTE.ink);
      mouth.rotation.z = Math.PI;
      mouth.position.set(0, -0.04, 0.74);
      face.add(mouth);
    }

    // 手腳（走路時擺動）
    const feet = [], hands = [];
    [-1, 1].forEach(function (s) {
      const foot = sphere(0.2, shade, 16);
      foot.scale.set(1.1, 0.6, 1.3);
      foot.position.set(0.3 * s, 0.08, 0.15);
      body.add(foot);
      feet.push(foot);
      const hand = sphere(0.15, skin, 16);
      hand.position.set(0.8 * s, 0.6, 0.1);
      body.add(hand);
      hands.push(hand);
    });

    // 耳朵 / 頭飾
    const inner = tint(look.cheek, '#ffffff', 0.3);
    [-1, 1].forEach(function (s) {
      if (look.ears === 'cat') {
        const ear = mesh(new THREE.ConeGeometry(0.19, 0.36, 16), skin);
        ear.position.set(0.4 * s, topY - 0.12, 0);
        ear.rotation.z = -0.4 * s;
        body.add(ear);
        const ein = mesh(new THREE.ConeGeometry(0.1, 0.2, 12), inner);
        ein.position.set(0.4 * s, topY - 0.15, 0.09);
        ein.rotation.z = -0.4 * s;
        body.add(ein);
      } else if (look.ears === 'bear') {
        const ear = sphere(0.18, skin, 16);
        ear.position.set(0.46 * s, topY - 0.18, 0);
        body.add(ear);
        const ein = sphere(0.09, inner, 12);
        ein.scale.z = 0.5;
        ein.position.set(0.46 * s, topY - 0.18, 0.12);
        body.add(ein);
      } else if (look.ears === 'bunny') {
        const ear = mesh(new THREE.CapsuleGeometry(0.1, 0.42, 6, 12), skin);
        ear.position.set(0.22 * s, topY + 0.2, -0.05);
        ear.rotation.z = -0.18 * s;
        body.add(ear);
        const ein = mesh(new THREE.CapsuleGeometry(0.05, 0.3, 6, 10), inner);
        ein.position.set(0.22 * s, topY + 0.2, 0.03);
        ein.rotation.z = -0.18 * s;
        body.add(ein);
      } else if (look.ears === 'antenna') {
        const stick = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.32, 8), shade);
        stick.position.set(0.2 * s, topY + 0.1, 0);
        stick.rotation.z = -0.25 * s;
        body.add(stick);
        const bob = sphere(0.08, look.accent, 12);
        bob.position.set(0.24 * s, topY + 0.27, 0);
        body.add(bob);
      } else if (look.ears === 'horns') {
        const horn = mesh(new THREE.ConeGeometry(0.09, 0.26, 12), PALETTE.cream);
        horn.position.set(0.3 * s, topY + 0.02, 0.12);
        horn.rotation.z = -0.3 * s;
        body.add(horn);
      }
    });
    if (look.ears === 'tuft') {
      [[0, 0.06, 0.1], [-0.12, 0.02, 0.07], [0.12, 0.02, 0.07]].forEach(function (p) {
        const t = sphere(p[2], skin, 12);
        t.position.set(p[0], topY + p[1], 0.05);
        body.add(t);
      });
    }

    // 花紋
    if (look.pattern === 'belly') {
      const belly = sphere(0.48, tint(skin, '#ffffff', 0.55), 24);
      belly.scale.set(1, 0.95, 0.45);
      belly.position.set(0, 0.48, 0.46);
      body.add(belly);
    } else if (look.pattern === 'spots') {
      const rnd = seeded(hashString(look.key + '#spots'));
      for (let i = 0; i < 5; i++) {
        const a = Math.PI * (0.6 + rnd() * 0.4) * (i % 2 ? 1 : -1); // 背面與側面（a≈π 為背面）
        const el = 0.15 + rnd() * 0.5;
        const spot = sphere(0.1 + rnd() * 0.05, look.accent, 12);
        spot.scale.set(1, 1, 0.4);
        const r = 0.76;
        spot.position.set(Math.sin(a) * Math.cos(el) * r, 0.72 + Math.sin(el) * r * look.squash, Math.cos(a) * Math.cos(el) * r);
        spot.lookAt(spot.position.x * 2, spot.position.y, spot.position.z * 2);
        body.add(spot);
      }
    } else if (look.pattern === 'band') {
      const band = mesh(new THREE.TorusGeometry(0.69, 0.05, 10, 36), look.accent);
      band.rotation.x = Math.PI / 2;
      band.position.y = 0.72 + 0.35 * look.squash;
      band.scale.set(1, 1, 1);
      body.add(band);
    }

    // 尾巴
    if (look.tail === 'ball') {
      const tail = sphere(0.16, tint(skin, '#ffffff', 0.5), 14);
      tail.position.set(0, 0.42, -0.76);
      body.add(tail);
    } else if (look.tail === 'curl') {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.35, -0.65), new THREE.Vector3(0, 0.35, -1.0),
        new THREE.Vector3(0, 0.7, -1.1), new THREE.Vector3(0, 0.85, -0.9)
      ]);
      const tail = mesh(new THREE.TubeGeometry(curve, 20, 0.07, 8, false), skin);
      body.add(tail);
      const tip = sphere(0.09, look.accent, 10);
      tip.position.set(0, 0.85, -0.9);
      body.add(tip);
    }

    const accessory = new THREE.Group();
    accessory.position.y = topY - 1.44; // 等級配件跟著頭頂高度
    body.add(accessory);

    avatarParts = {
      body: body, eyes: eyes, feet: feet, hands: hands, accessory: accessory,
      jump: avatarParts.jump || 0, nextBlink: avatarParts.nextBlink || 2,
      lookKey: look.key, level: avatarParts.level || 0
    };
    avatar.scale.setScalar(look.size);
    if (avatarParts.level) {
      const lv = avatarParts.level;
      avatarParts.level = 0;
      setAvatarLevel(lv);
    }
  }

  function setAvatarLevel(level) {
    if (avatarParts.level === level) return;
    avatarParts.level = level;
    const acc = avatarParts.accessory;
    while (acc.children.length) acc.remove(acc.children[0]);
    const top = 1.42;

    if (level >= 12) {
      // 皇冠
      const crown = new THREE.Group();
      const ring = mesh(new THREE.CylinderGeometry(0.32, 0.34, 0.2, 20, 1, true), PALETTE.gold, { side: THREE.DoubleSide });
      crown.add(ring);
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * Math.PI * 2;
        const spike = mesh(new THREE.ConeGeometry(0.08, 0.2, 10), PALETTE.gold);
        spike.position.set(Math.cos(a) * 0.32, 0.18, Math.sin(a) * 0.32);
        crown.add(spike);
        const gem = sphere(0.04, PALETTE.roofs[i % PALETTE.roofs.length], 8);
        gem.position.set(Math.cos(a) * 0.34, 0.02, Math.sin(a) * 0.34);
        crown.add(gem);
      }
      crown.position.y = top + 0.05;
      acc.add(crown);
    } else if (level >= 5) {
      // 魔法帽
      const hat = new THREE.Group();
      const brim = mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.06, 28), '#9b86e8');
      hat.add(brim);
      const cone = mesh(new THREE.ConeGeometry(0.34, 0.7, 24), '#9b86e8');
      cone.position.y = 0.36;
      cone.rotation.z = -0.15;
      hat.add(cone);
      const star = sphere(0.07, PALETTE.gold, 10);
      star.position.set(0.12, 0.3, 0.27);
      hat.add(star);
      hat.position.y = top;
      acc.add(hat);
    } else if (level >= 3) {
      // 頭上的小芽
      const sprout = new THREE.Group();
      const stem = mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.25, 8), PALETTE.grassDark);
      stem.position.y = 0.12;
      sprout.add(stem);
      [-1, 1].forEach(function (s) {
        const leaf = sphere(0.11, PALETTE.leaves[0], 12);
        leaf.scale.set(1.4, 0.5, 0.8);
        leaf.position.set(0.11 * s, 0.26, 0);
        leaf.rotation.z = 0.4 * s;
        sprout.add(leaf);
      });
      sprout.position.y = top - 0.05;
      acc.add(sprout);
    }

    if (level >= 8) {
      // 圍巾
      const scarf = mesh(new THREE.TorusGeometry(0.62, 0.09, 12, 32), '#ff8fa3');
      scarf.rotation.x = Math.PI / 2;
      scarf.position.y = 0.42;
      acc.add(scarf);
    }
    if (level >= 16) {
      // 光環
      const halo = mesh(new THREE.TorusGeometry(0.35, 0.04, 10, 32), PALETTE.gold, { emissive: '#ffcc55', emissiveIntensity: 0.5 });
      halo.rotation.x = Math.PI / 2;
      halo.position.y = top + 0.6;
      halo.userData.spin = true;
      acc.add(halo);
    }
  }

  // ---------- 任務建築 ----------

  function starShape(outer, inner) {
    const shape = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = i / 10 * Math.PI * 2 + Math.PI / 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
    }
    shape.closePath();
    return shape;
  }

  function buildMarker(status) {
    const g = new THREE.Group();
    if (status === 'todo') {
      const bar = mesh(new THREE.CapsuleGeometry(0.07, 0.22, 6, 12), PALETTE.orange);
      bar.position.y = 0.2;
      g.add(bar);
      const dot = sphere(0.08, PALETTE.orange, 12);
      dot.position.y = -0.08;
      g.add(dot);
    } else if (status === 'completed') {
      const pole = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.7, 8), PALETTE.wood);
      pole.position.y = 0.1;
      g.add(pole);
      const flag = mesh(new THREE.BoxGeometry(0.34, 0.22, 0.04), PALETTE.mint);
      flag.position.set(0.18, 0.33, 0);
      g.add(flag);
      g.userData.flag = flag;
    } else if (status === 'perfect') {
      const geom = new THREE.ExtrudeGeometry(starShape(0.3, 0.14), {
        depth: 0.08, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 4
      });
      geom.center();
      const star = mesh(geom, PALETTE.gold, { emissive: '#ffb703', emissiveIntensity: 0.15 });
      g.add(star);
    }
    return g;
  }

  function buildHouse(colorIdx, grey) {
    const g = new THREE.Group();
    const wall = mesh(new THREE.CylinderGeometry(0.55, 0.62, 0.8, 24), grey ? PALETTE.grey : PALETTE.cream);
    wall.position.y = 0.4;
    g.add(wall);
    const roof = mesh(new THREE.ConeGeometry(0.82, 0.75, 24), grey ? '#bfb8c4' : PALETTE.roofs[colorIdx % PALETTE.roofs.length]);
    roof.position.y = 1.15;
    g.add(roof);
    const roofTip = sphere(0.1, grey ? '#bfb8c4' : PALETTE.roofs[colorIdx % PALETTE.roofs.length], 12);
    roofTip.position.y = 1.55;
    g.add(roofTip);
    const door = sphere(0.2, PALETTE.wood, 16);
    door.scale.set(0.9, 1.25, 0.35);
    door.position.set(0, 0.25, 0.58);
    g.add(door);
    const win = sphere(0.11, grey ? '#e3e0e6' : PALETTE.window, 12);
    win.scale.z = 0.4;
    win.position.set(0.3, 0.55, 0.5);
    g.add(win);
    return { group: g, height: 1.7 };
  }

  function buildMushroom(colorIdx, grey) {
    const g = new THREE.Group();
    const stem = mesh(new THREE.CylinderGeometry(0.24, 0.32, 0.65, 18), grey ? PALETTE.grey : PALETTE.cream);
    stem.position.y = 0.32;
    g.add(stem);
    const capColor = grey ? '#bfb8c4' : PALETTE.caps[colorIdx % PALETTE.caps.length];
    const cap = sphere(0.62, capColor, 28);
    cap.scale.set(1, 0.62, 1);
    cap.position.y = 0.78;
    g.add(cap);
    const rnd = seeded(colorIdx + 5);
    for (let i = 0; i < 6; i++) {
      const a = rnd() * Math.PI * 2;
      const t = 0.3 + rnd() * 0.5;
      const dot = sphere(0.07, '#ffffff', 10);
      dot.scale.y = 0.5;
      dot.position.set(Math.cos(a) * 0.5 * t * 1.1, 0.78 + 0.62 * 0.62 * Math.sqrt(1 - t * t * 0.9), Math.sin(a) * 0.5 * t * 1.1);
      g.add(dot);
    }
    const door = sphere(0.12, PALETTE.wood, 12);
    door.scale.set(0.9, 1.3, 0.35);
    door.position.set(0, 0.18, 0.28);
    g.add(door);
    return { group: g, height: 1.3 };
  }

  function questPositions(n) {
    // 向日葵排列，平均分散在島上（避開中央角色）
    const out = [];
    for (let i = 0; i < n; i++) {
      const r = 2.7 + (ISLAND_R - 3.6) * Math.sqrt((i + 0.5) / Math.max(n, 1));
      const a = i * 2.39996 + 0.6;
      out.push({ x: Math.cos(a) * r, z: Math.sin(a) * r });
    }
    return out;
  }

  function buildPad(color) {
    const g = new THREE.Group();
    const mat = mesh(new THREE.CylinderGeometry(0.5, 0.54, 0.08, 28), tint(color, '#ffffff', 0.35));
    mat.position.y = 0.04;
    g.add(mat);
    const ring = mesh(new THREE.TorusGeometry(0.5, 0.05, 8, 32), color, { emissive: color, emissiveIntensity: 0 });
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.09;
    g.add(ring);
    g.userData.ring = ring;
    return g;
  }

  function clearQuests() {
    quests.forEach(function (q) { if (q.label) q.label.remove(); });
    quests = [];
    questObstacles = [];
    while (questLayer.children.length) questLayer.remove(questLayer.children[0]);
  }

  function buildQuests(assignments, profile) {
    clearQuests();
    const list = assignments.slice().sort(function (a, b) {
      if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
      if (a.questType !== b.questType) return a.questType === 'main' ? -1 : 1;
      return 0;
    });
    const pos = questPositions(list.length);
    list.forEach(function (a, i) {
      const qp = (profile && profile.quests && profile.quests[a.assignmentId]) || null;
      const closed = !a.isActive;
      const status = closed ? 'closed' : (qp ? qp.status : 'todo');
      const built = a.questType === 'side' ? buildMushroom(i, closed) : buildHouse(i, closed);
      const g = new THREE.Group();
      g.add(built.group);
      const scale = 0.82 + 0.08 * (a.difficulty || 1);
      built.group.scale.setScalar(scale);

      const p = pos[i];
      const baseY = groundY(p.x, p.z) - 0.04 - (closed ? 0.12 : 0);
      g.position.set(p.x, baseY, p.z);
      g.lookAt(0, baseY, 0); // 門朝向中央廣場
      g.userData.questId = a.assignmentId;

      // 碰撞範圍與門口地墊
      const footR = (a.questType === 'side' ? 0.42 : 0.66) * scale;
      questObstacles.push({ x: p.x, z: p.z, r: footR });
      const len = Math.sqrt(p.x * p.x + p.z * p.z) || 1;
      const padDist = footR + AVATAR_R + 0.12;
      const padX = p.x - p.x / len * padDist, padZ = p.z - p.z / len * padDist;
      const padColor = closed ? PALETTE.grey : (a.questType === 'side' ? PALETTE.caps[i % PALETTE.caps.length] : PALETTE.roofs[i % PALETTE.roofs.length]);
      const pad = buildPad(padColor);
      pad.position.set(padX, groundY(padX, padZ) - 0.06, padZ);
      questLayer.add(pad);

      let marker = null;
      if (status !== 'closed') {
        marker = buildMarker(status);
        marker.position.y = built.height * scale + 0.45;
        g.add(marker);
      }
      questLayer.add(g);

      const label = document.createElement('button');
      label.className = 'quest-label ' + status;
      label.type = 'button';
      const statusText = {
        todo: '待挑戰', completed: '已完成 ' + (qp ? qp.score : ''), perfect: '滿分通關', closed: '已關閉'
      }[status];
      label.innerHTML = '<span class="ql-title"></span><span class="ql-status"></span>';
      label.querySelector('.ql-title').textContent = a.title;
      label.querySelector('.ql-status').textContent = (a.questType === 'side' ? '支線・' : '主線・') + statusText;
      label.addEventListener('click', function () { walkToQuest(a.assignmentId); });
      labelLayer.appendChild(label);

      quests.push({
        id: a.assignmentId, group: g, marker: marker, label: label,
        hover: 0, closed: closed, labelHeight: built.height * scale + 1.0,
        phase: i * 0.7, pad: pad, padX: padX, padZ: padZ
      });
    });
    const occupied = pos.map(function (p) { return { x: p.x, z: p.z }; });
    const paths = quests.map(function (q) { return { x1: 0, z1: 0, x2: q.padX, z2: q.padZ }; });
    buildDecorations(occupied, paths);
    // 新的小屋可能蓋在角色身上：先把角色推開；若已站在某個門口，不重複觸發
    resolveCollisions();
    if (avatar) avatar.position.set(player.x, groundY(player.x, player.z) - 0.05, player.z);
    player.zone = currentZone();
    if (player.targetQuest && !quests.some(function (q) { return q.id === player.targetQuest; })) {
      player.targetQuest = null;
      player.target = null;
    }
  }

  // ---------- 彩紙與慶祝 ----------

  function celebrate(levelUp) {
    avatarParts.jump = levelUp ? 1.6 : 0.9;
    const count = levelUp ? 90 : 45;
    const origin = new THREE.Vector3();
    avatar.getWorldPosition(origin);
    origin.y += 1.4;
    for (let i = 0; i < count; i++) {
      const color = PALETTE.confetti[i % PALETTE.confetti.length];
      const m = i % 3 === 0
        ? sphere(0.07, color, 8)
        : mesh(new THREE.BoxGeometry(0.12, 0.04, 0.08), color);
      m.castShadow = false;
      m.position.copy(origin);
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 3;
      m.userData = {
        v: new THREE.Vector3(Math.cos(a) * sp, 5 + Math.random() * 4, Math.sin(a) * sp),
        spin: new THREE.Vector3(Math.random() * 6, Math.random() * 6, Math.random() * 6),
        life: 2.2 + Math.random() * 0.8
      };
      scene.add(m);
      confetti.push(m);
    }
  }

  /** 自動走到任務門口（抵達後由地墊觸發 onQuestEnter） */
  function walkToQuest(id) {
    const q = quests.find(function (x) { return x.id === id; });
    if (!q) return;
    if (player.zone === id) {
      // 已經站在門口：直接再開一次
      if (callbacks.onQuestEnter) callbacks.onQuestEnter(id);
      return;
    }
    setRoute(q.padX, q.padZ);
    player.targetQuest = id;
    showTargetRing(q.padX, q.padZ);
    // 鏡頭轉到能看見目的地的方向
    const dx = q.padX - player.x, dz = q.padZ - player.z;
    if (dx * dx + dz * dz > 4) cam.tTheta = lerpAngle(cam.tTheta, Math.atan2(-dx, -dz), 0.5);
  }

  function walkTo(x, z) {
    const r = Math.sqrt(x * x + z * z);
    if (r > WALK_LIMIT) { x *= WALK_LIMIT / r; z *= WALK_LIMIT / r; }
    setRoute(x, z);
    player.targetQuest = null;
    showTargetRing(x, z);
  }

  function setRoute(x, z) {
    resolveCollisions();
    player.path = findPath(player.x, player.z, x, z);
    player.target = player.path.shift();
    player.stuck = 0;
  }

  function showTargetRing(x, z) {
    if (!targetRing) {
      targetRing = mesh(new THREE.TorusGeometry(0.32, 0.05, 8, 28), '#ffffff', { transparent: true, opacity: 0.9 });
      targetRing.rotation.x = Math.PI / 2;
      targetRing.castShadow = false;
      island.add(targetRing);
    }
    targetRing.position.set(x, groundY(x, z) + 0.06, z);
    targetRing.userData.life = 1;
    targetRing.visible = true;
  }

  function currentZone() {
    let best = null, bestD = PAD_TRIGGER * PAD_TRIGGER;
    quests.forEach(function (q) {
      const dx = q.padX - player.x, dz = q.padZ - player.z;
      const d = dx * dx + dz * dz;
      if (d < bestD) { bestD = d; best = q.id; }
    });
    return best;
  }

  /** 把角色推出障礙物並限制在島上 */
  function resolveCollisions() {
    for (let iter = 0; iter < 2; iter++) {
      [questObstacles, decoObstacles].forEach(function (list) {
        list.forEach(function (o) {
          const dx = player.x - o.x, dz = player.z - o.z;
          const min = o.r + AVATAR_R;
          const d2 = dx * dx + dz * dz;
          if (d2 < min * min) {
            const d = Math.sqrt(d2) || 0.0001;
            player.x = o.x + dx / d * min;
            player.z = o.z + dz / d * min;
          }
        });
      });
    }
    const r = Math.sqrt(player.x * player.x + player.z * player.z);
    if (r > WALK_LIMIT) { player.x *= WALK_LIMIT / r; player.z *= WALK_LIMIT / r; }
  }

  // ---------- 尋路（格子 A*，島很小所以很便宜） ----------

  const GRID = 0.25;
  const GRID_N = Math.ceil(ISLAND_R * 2 / GRID);

  function blockedAt(x, z, margin) {
    if (x * x + z * z > WALK_LIMIT * WALK_LIMIT) return true;
    const lists = [questObstacles, decoObstacles];
    for (let l = 0; l < 2; l++) {
      const list = lists[l];
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        const dx = x - o.x, dz = z - o.z, min = o.r + AVATAR_R + margin;
        if (dx * dx + dz * dz < min * min) return true;
      }
    }
    return false;
  }

  function lineFree(x1, z1, x2, z2) {
    const len = Math.hypot(x2 - x1, z2 - z1);
    const steps = Math.max(1, Math.ceil(len / 0.1));
    for (let i = 1; i <= steps; i++) {
      const k = i / steps;
      if (blockedAt(x1 + (x2 - x1) * k, z1 + (z2 - z1) * k, 0.03)) return false;
    }
    return true;
  }

  /** 回傳從 (sx,sz) 到 (tx,tz) 的路徑點；找不到時回傳直線 */
  function findPath(sx, sz, tx, tz) {
    if (lineFree(sx, sz, tx, tz)) return [{ x: tx, z: tz }];
    const toCell = function (v) { return Math.max(0, Math.min(GRID_N - 1, Math.floor((v + ISLAND_R) / GRID))); };
    const center = function (c) { return c * GRID - ISLAND_R + GRID / 2; };
    const N = GRID_N;
    const blocked = new Uint8Array(N * N);
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) blocked[i * N + j] = blockedAt(center(i), center(j), 0.02) ? 1 : 0;
    const start = toCell(sx) * N + toCell(sz);
    let goal = toCell(tx) * N + toCell(tz);
    blocked[start] = 0;
    if (blocked[goal]) {
      // 目的地被擋住：找最近的空格
      let best = -1, bd = Infinity;
      for (let k = 0; k < N * N; k++) {
        if (blocked[k]) continue;
        const d = Math.hypot(center(Math.floor(k / N)) - tx, center(k % N) - tz);
        if (d < bd) { bd = d; best = k; }
      }
      if (best < 0) return [{ x: tx, z: tz }];
      goal = best;
    }
    const g = new Float32Array(N * N).fill(Infinity);
    const from = new Int32Array(N * N).fill(-1);
    const closed = new Uint8Array(N * N);
    const open = [start];
    g[start] = 0;
    const gi = Math.floor(goal / N), gj = goal % N;
    const h = function (k) { return Math.hypot(Math.floor(k / N) - gi, k % N - gj); };
    let found = false;
    while (open.length) {
      let bi = 0, bf = Infinity;
      for (let k = 0; k < open.length; k++) {
        const f = g[open[k]] + h(open[k]);
        if (f < bf) { bf = f; bi = k; }
      }
      const cur = open[bi];
      open[bi] = open[open.length - 1];
      open.pop();
      if (cur === goal) { found = true; break; }
      if (closed[cur]) continue;
      closed[cur] = 1;
      const ci = Math.floor(cur / N), cj = cur % N;
      for (let di = -1; di <= 1; di++) {
        for (let dj = -1; dj <= 1; dj++) {
          if (!di && !dj) continue;
          const ni = ci + di, nj = cj + dj;
          if (ni < 0 || nj < 0 || ni >= N || nj >= N) continue;
          const nk = ni * N + nj;
          if (blocked[nk] || closed[nk]) continue;
          if (di && dj && (blocked[ci * N + nj] || blocked[ni * N + cj])) continue; // 不切角
          const ng = g[cur] + (di && dj ? 1.4142 : 1);
          if (ng < g[nk]) {
            g[nk] = ng;
            from[nk] = cur;
            open.push(nk);
          }
        }
      }
    }
    if (!found) return [{ x: tx, z: tz }];
    const cells = [];
    for (let k = goal; k !== -1 && k !== start; k = from[k]) cells.push({ x: center(Math.floor(k / N)), z: center(k % N) });
    cells.reverse();
    if (goal === toCell(tx) * N + toCell(tz)) cells[cells.length - 1] = { x: tx, z: tz };
    // 拉直：能直線到達的點就跳過中間點
    const out = [];
    let cx = sx, cz = sz, i = 0;
    while (i < cells.length) {
      let j = cells.length - 1;
      while (j > i && !lineFree(cx, cz, cells[j].x, cells[j].z)) j--;
      out.push(cells[j]);
      cx = cells[j].x; cz = cells[j].z;
      i = j + 1;
    }
    return out;
  }

  function isTyping(e) {
    const el = e.target;
    if (!el || !el.tagName) return false;
    const tag = el.tagName.toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
  }

  const KEY_DIRS = {
    w: 'up', arrowup: 'up', s: 'down', arrowdown: 'down',
    a: 'left', arrowleft: 'left', d: 'right', arrowright: 'right'
  };

  function onKeyDown(e) {
    if (isTyping(e) || e.metaKey || e.ctrlKey || e.altKey) return;
    const dir = KEY_DIRS[e.key.toLowerCase()];
    if (!dir) return;
    if (document.querySelector('.modal-backdrop.open')) return;
    keys[dir] = true;
    player.target = null;
    player.targetQuest = null;
    e.preventDefault();
  }

  function onKeyUp(e) {
    const dir = KEY_DIRS[(e.key || '').toLowerCase()];
    if (dir) keys[dir] = false;
  }

  // ---------- 互動 ----------

  function onPointerDown(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false, id: e.pointerId };
  }

  function onPointerMove(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    if (!drag || pinch.active) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) drag.moved = true;
    cam.tTheta -= dx * 0.008;
    cam.tPhi = Math.max(0.55, Math.min(1.25, cam.tPhi - dy * 0.005));
  }

  function onPointerUp(e) {
    if (drag && !drag.moved && e.target === renderer.domElement) {
      const hit = pick();
      if (hit && hit.questId) walkToQuest(hit.questId);
      else if (hit && hit.avatar && callbacks.onAvatarClick) callbacks.onAvatarClick();
      else {
        // 點地面：走過去
        raycaster.setFromCamera(pointer, camera);
        const g = raycaster.intersectObject(islandTop, false);
        if (g.length) {
          const local = island.worldToLocal(g[0].point.clone());
          walkTo(local.x, local.z);
        }
      }
    }
    drag = null;
  }

  function pick() {
    raycaster.setFromCamera(pointer, camera);
    const targets = quests.map(function (q) { return q.group; }).concat([avatar]);
    const hits = raycaster.intersectObjects(targets, true);
    if (!hits.length) return null;
    let o = hits[0].object;
    while (o) {
      if (o.userData && o.userData.questId) return { questId: o.userData.questId };
      if (o.userData && o.userData.isAvatar) return { avatar: true };
      o = o.parent;
    }
    return null;
  }

  function onWheel(e) {
    e.preventDefault();
    cam.tRadius = Math.max(7, Math.min(cam.maxR || 26, cam.tRadius + e.deltaY * 0.01));
  }

  function onTouchStart(e) {
    if (e.touches.length === 2) {
      pinch.active = true;
      pinch.dist = touchDist(e);
    }
  }
  function onTouchMove(e) {
    if (pinch.active && e.touches.length === 2) {
      e.preventDefault();
      const d = touchDist(e);
      cam.tRadius = Math.max(7, Math.min(cam.maxR || 26, cam.tRadius - (d - pinch.dist) * 0.03));
      pinch.dist = d;
      if (drag) drag.moved = true;
    }
  }
  function onTouchEnd(e) {
    if (e.touches.length < 2) pinch.active = false;
  }
  function touchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 50 : 42;
    camera.updateProjectionMatrix();
    // 跟隨鏡頭：預設距離依畫面比例調整（直式螢幕拉遠一些），最遠可看見整座島
    const hHalf = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
    const fit = Math.max(18, (ISLAND_R + 1) / Math.tan(hHalf));
    const base = Math.max(11, Math.min(fit * 0.62, 20));
    const prevBase = cam.base || base;
    cam.base = base;
    cam.maxR = fit + 4;
    cam.tRadius = Math.min(cam.maxR, Math.max(7, cam.tRadius * base / prevBase));
    if (!cam.sized) { cam.tRadius = base; cam.radius = base; cam.sized = true; }
  }

  // ---------- 動畫迴圈 ----------

  const tmpV = new THREE.Vector3();

  function animate() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    updatePlayer(dt, t);

    // 跟隨鏡頭
    tmpV.set(player.x, groundY(player.x, player.z) + 0.7, player.z);
    island.localToWorld(tmpV);
    camTarget.lerp(tmpV, Math.min(1, dt * 5));
    cam.theta += (cam.tTheta - cam.theta) * Math.min(1, dt * 6);
    cam.phi += (cam.tPhi - cam.phi) * Math.min(1, dt * 6);
    cam.radius += (cam.tRadius - cam.radius) * Math.min(1, dt * 6);
    camera.position.set(
      camTarget.x + Math.sin(cam.theta) * Math.sin(cam.phi) * cam.radius,
      camTarget.y + Math.cos(cam.phi) * cam.radius,
      camTarget.z + Math.cos(cam.theta) * Math.sin(cam.phi) * cam.radius
    );
    camera.lookAt(camTarget);

    island.position.y = Math.sin(t * 0.6) * 0.08;

    // 角色：呼吸般的擠壓伸展、眨眼、跳躍、走路擺動
    const b = avatarParts.body;
    let hop = 0;
    if (avatarParts.jump > 0) {
      avatarParts.jump = Math.max(0, avatarParts.jump - dt);
      hop = Math.abs(Math.sin(avatarParts.jump * Math.PI * 2.5)) * 0.9;
    }
    const walkK = player.moving ? 1 : 0;
    avatarParts.walkK = (avatarParts.walkK || 0) + (walkK - (avatarParts.walkK || 0)) * Math.min(1, dt * 10);
    const wk = avatarParts.walkK;
    const step = Math.sin(player.walkPhase);
    hop += Math.abs(step) * 0.12 * wk;
    const squash = 1 + Math.sin(t * 2.2) * 0.035 * (1 - wk) + Math.abs(Math.cos(player.walkPhase)) * 0.05 * wk;
    b.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
    b.position.y = hop;
    b.rotation.x = 0.1 * wk; // 走路時微微前傾
    b.rotation.z = step * 0.07 * wk;
    avatarParts.feet.forEach(function (f, i) {
      const sgn = i ? 1 : -1;
      f.position.z = 0.15 + step * 0.22 * sgn * wk;
      f.position.y = 0.08 + Math.max(0, step * sgn) * 0.12 * wk;
    });
    avatarParts.hands.forEach(function (h, i) {
      const sgn = i ? -1 : 1;
      h.position.z = 0.1 + step * 0.18 * sgn * wk;
      h.position.y = 0.6 + Math.sin(t * 2.2 + i) * 0.02 * (1 - wk);
    });
    if (t > avatarParts.nextBlink) {
      avatarParts.eyes.forEach(function (eye) { eye.scale.y = 0.12; });
      if (t > avatarParts.nextBlink + 0.12) {
        avatarParts.eyes.forEach(function (eye) { eye.scale.y = 1; });
        avatarParts.nextBlink = t + 2 + Math.random() * 3;
      }
    }
    if (!player.moving && t - player.lastMove > 2.5) {
      // 閒置一陣子就轉頭看鏡頭
      const camAngle = Math.atan2(camera.position.x - camTarget.x, camera.position.z - camTarget.z);
      avatar.rotation.y = lerpAngle(avatar.rotation.y, camAngle, Math.min(1, dt * 2));
    }
    avatarParts.accessory.children.forEach(function (c) { if (c.userData.spin) c.rotation.z += dt; });

    // 門口地墊：角色站上去時發光
    quests.forEach(function (q) {
      const ring = q.pad.userData.ring;
      const on = player.zone === q.id || player.targetQuest === q.id;
      ring.material.emissiveIntensity += ((on ? 0.6 + Math.sin(t * 5) * 0.25 : 0) - ring.material.emissiveIntensity) * Math.min(1, dt * 8);
      q.pad.scale.setScalar(1 + (player.zone === q.id ? 0.08 : 0));
    });
    if (targetRing && targetRing.visible) {
      targetRing.userData.life -= dt * 0.8;
      targetRing.material.opacity = Math.max(0, targetRing.userData.life);
      targetRing.scale.setScalar(1 + (1 - targetRing.userData.life) * 0.6);
      if (targetRing.userData.life <= 0 || !player.target) targetRing.visible = false;
    }

    // 滑鼠懸停
    let hovered = null;
    if (!drag) {
      const h = pick();
      hovered = h && h.questId ? h.questId : (h && h.avatar ? '__avatar' : null);
    }
    renderer.domElement.style.cursor = hovered ? 'pointer' : (drag ? 'grabbing' : 'grab');

    const rect = renderer.domElement.getBoundingClientRect();
    quests.forEach(function (q) {
      const target = hovered === q.id ? 1 : 0;
      q.hover += (target - q.hover) * Math.min(1, dt * 10);
      const s = 1 + q.hover * 0.12;
      q.group.scale.set(s, s * (1 + Math.sin(t * 3 + q.phase) * 0.01), s);
      if (q.marker) {
        q.marker.position.y += Math.sin(t * 2.5 + q.phase) * 0.004;
        q.marker.rotation.y += dt * (q.marker.userData.flag ? 0 : 1.4);
        if (q.marker.userData.flag) q.marker.userData.flag.rotation.y = Math.sin(t * 3 + q.phase) * 0.35;
      }
      // 標籤投影到螢幕
      tmpV.set(0, q.labelHeight, 0);
      q.group.localToWorld(tmpV);
      tmpV.project(camera);
      const visible = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
      q.label.style.display = visible ? '' : 'none';
      if (visible) {
        const x = (tmpV.x * 0.5 + 0.5) * rect.width;
        const y = (-tmpV.y * 0.5 + 0.5) * rect.height;
        q.label.style.transform = 'translate(-50%, -100%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
        q.label.style.zIndex = String(Math.round((1 - tmpV.z) * 1000));
        q.label.classList.toggle('hovered', hovered === q.id);
      }
    });

    decoLayer.children.forEach(function (d) {
      if (d.userData.sway !== undefined) d.rotation.z = Math.sin(t * 1.2 + d.userData.sway) * 0.03;
    });

    clouds.forEach(function (c) {
      const u = c.userData;
      u.angle += dt * u.speed;
      c.position.set(Math.cos(u.angle) * u.radius, u.y + Math.sin(t * 0.5 + u.angle) * 0.2, Math.sin(u.angle) * u.radius);
      c.lookAt(0, c.position.y, 0);
    });

    for (let i = confetti.length - 1; i >= 0; i--) {
      const m = confetti[i];
      const u = m.userData;
      u.life -= dt;
      u.v.y -= 9.8 * dt;
      u.v.multiplyScalar(0.985);
      m.position.addScaledVector(u.v, dt);
      m.rotation.x += u.spin.x * dt; m.rotation.y += u.spin.y * dt; m.rotation.z += u.spin.z * dt;
      if (u.life <= 0 || m.position.y < -8) {
        scene.remove(m);
        confetti.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  /** 依鍵盤或點擊目標移動角色，並偵測是否站上門口 */
  function updatePlayer(dt, t) {
    let dirX = 0, dirZ = 0;
    const kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const kz = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
    if (kx || kz) {
      // 以鏡頭方向為準：上 = 往畫面深處
      const s = Math.sin(cam.theta), c = Math.cos(cam.theta);
      dirX = -s * kz + c * kx;
      dirZ = -c * kz - s * kx;
    } else if (player.target) {
      const dx = player.target.x - player.x, dz = player.target.z - player.z;
      const d = Math.sqrt(dx * dx + dz * dz);
      const last = !player.path || !player.path.length;
      if (!last && d < 0.25) {
        player.target = player.path.shift(); // 下一個路徑點
        dirX = dx / d; dirZ = dz / d;
      } else if (d < 0.08) {
        player.target = null;
      } else {
        dirX = dx / d; dirZ = dz / d;
        if (last && d < 0.4) { dirX *= d / 0.4; dirZ *= d / 0.4; } // 接近時放慢
      }
    }

    const mag = Math.sqrt(dirX * dirX + dirZ * dirZ);
    player.moving = mag > 0.01;
    if (player.moving) {
      const nx = dirX / mag, nz = dirZ / mag;
      const speed = WALK_SPEED * Math.min(1, mag);
      const ox = player.x, oz = player.z;
      player.x += nx * speed * dt;
      player.z += nz * speed * dt;
      resolveCollisions();
      const moved = Math.hypot(player.x - ox, player.z - oz);
      player.walkPhase += moved * 4.2;
      player.lastMove = t;
      avatar.rotation.y = lerpAngle(avatar.rotation.y, Math.atan2(nx, nz), Math.min(1, dt * 12));
      // 卡住太久就放棄自動行走
      if (player.target) {
        player.stuck = moved < speed * dt * 0.2 ? player.stuck + dt : 0;
        if (player.stuck > 0.8) { player.target = null; player.targetQuest = null; }
      }
    }
    avatar.position.set(player.x, groundY(player.x, player.z) - 0.05, player.z);

    const zone = currentZone();
    if (zone !== player.zone) {
      const prev = player.zone;
      player.zone = zone;
      if (prev && callbacks.onQuestLeave) callbacks.onQuestLeave(prev);
      // 自動走向別的目的地途中經過的門口不觸發
      if (zone && (!player.target || player.targetQuest === zone)) {
        player.target = null;
        player.targetQuest = null;
        avatarParts.jump = Math.max(avatarParts.jump, 0.35);
        if (callbacks.onQuestEnter) callbacks.onQuestEnter(zone);
      }
    }
  }

  function lerpAngle(a, b, k) {
    let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * k;
  }

  // ---------- 初始化 ----------

  function init(containerEl, labelEl, cbs) {
    container = containerEl;
    labelLayer = labelEl;
    callbacks = cbs || {};

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    clock = new THREE.Clock();
    raycaster = new THREE.Raycaster();
    pointer = new THREE.Vector2(-10, -10);
    clayBump = makeClayBump();

    scene.add(new THREE.HemisphereLight('#fff7f0', '#cdb8ff', 1.5));
    const sun = new THREE.DirectionalLight('#fff4e6', 2.2);
    sun.position.set(7, 14, 8);
    sun.castShadow = true;
    const isSmall = Math.min(window.innerWidth, window.innerHeight) < 700;
    sun.shadow.mapSize.set(isSmall ? 1024 : 2048, isSmall ? 1024 : 2048);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -12;
    sun.shadow.camera.right = sun.shadow.camera.top = 12;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 40;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);
    const fill = new THREE.DirectionalLight('#ffd9ec', 0.6);
    fill.position.set(-8, 5, -6);
    scene.add(fill);

    buildIsland();
    buildAvatar();
    buildClouds();
    buildDecorations([]);

    const el = renderer.domElement;
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    el.addEventListener('wheel', onWheel, { passive: false });
    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    el.addEventListener('touchend', onTouchEnd);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', function () { Object.keys(keys).forEach(function (k) { keys[k] = false; }); });
    new ResizeObserver(resize).observe(container);
    resize();
    renderer.setAnimationLoop(animate);
  }

  function setData(data) {
    const look = avatarLook(data.email);
    if (look.key !== avatarParts.lookKey) applyLook(look);
    buildQuests(data.assignments || [], data.profile);
    setAvatarLevel((data.profile && data.profile.level) || 1);
  }

  function webglAvailable() {
    try {
      const c = document.createElement('canvas');
      return Boolean(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
    } catch (e) {
      return false;
    }
  }

  if (webglAvailable()) {
    window.ClayWorld = {
      init: init, setData: setData, celebrate: celebrate,
      walkToQuest: walkToQuest, avatarLook: avatarLook
    };
    window.dispatchEvent(new Event('clayworld-ready'));
  } else {
    window.dispatchEvent(new Event('clayworld-failed'));
  }
</script>
