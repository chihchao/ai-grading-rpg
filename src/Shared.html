<script>
  /**
   * Shared.html — 2D 與 3D 介面共用的前端程式：登入流程、檔案讀取、工具函式。
   * 各介面需自行定義全域 appState 與 onInitSuccess(data)。
   * 必要元素 id：relayTokenCarrier、loadingCard、authCard、authErrorBox、otpEmail、
   * sendOtpBtn、otpVerifyBox、otpCode、verifyOtpBtn、fileInput、dropZone、selectedFilesList。
   */
  const TEMPLATE_CARRIER = document.getElementById('relayTokenCarrier');
  const INITIAL_RELAY_TOKEN = (TEMPLATE_CARRIER.dataset.token || '').trim();
  const APP_URL = (TEMPLATE_CARRIER.dataset.appUrl || '').trim();
  const SESSION_KEY = 'ai_rpg_session_token';
  const CONSUMED_RELAY_KEY = 'ai_rpg_consumed_relay';

  const ALLOWED_EXT = new Set([
    'txt','md','csv','ipynb','py','json','js','jsx','ts','tsx','html','htm',
    'css','scss','xml','yaml','yml','sql','java','c','cpp','h','hpp','cs',
    'go','rs','php','rb','r','sh','bat','ps1','log','ini','toml','tex'
  ]);

  window.addEventListener('DOMContentLoaded', function () {
    setupFileEvents();
    bootstrap();
  });

  /** 切換介面的網址（尚未部署時為空字串） */
  function uiUrl(ui) {
    if (!APP_URL) return '';
    return ui === '2d' ? APP_URL + '?ui=2d' : APP_URL;
  }

  function token_() {
    return sessionStorage.getItem(SESSION_KEY) || '';
  }

  function bootstrap() {
    const consumedToken = sessionStorage.getItem(CONSUMED_RELAY_KEY) || '';
    if (INITIAL_RELAY_TOKEN && INITIAL_RELAY_TOKEN !== consumedToken) {
      sessionStorage.setItem(CONSUMED_RELAY_KEY, INITIAL_RELAY_TOKEN);
      google.script.run
        .withSuccessHandler(function (res) {
          sessionStorage.setItem(SESSION_KEY, res.sessionToken);
          loadInitData();
        })
        .withFailureHandler(function (err) {
          showAuthError(err.message);
          loadInitData();
        })
        .exchangeRelayToken(INITIAL_RELAY_TOKEN);
    } else {
      loadInitData();
    }
  }

  function loadInitData() {
    google.script.run
      .withSuccessHandler(onInitSuccess)
      .withFailureHandler(function (err) {
        document.getElementById('loadingCard').innerHTML =
          '<div class="alert alert-error">系統載入失敗：' + escapeHtml(err.message) + '</div>';
      })
      .getAppInitData(token_());
  }

  function handleSendOtp() {
    const email = document.getElementById('otpEmail').value.trim();
    const btn = document.getElementById('sendOtpBtn');
    btn.disabled = true;
    btn.textContent = '寄送中...';
    hideAuthError();

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = '重新寄送驗證碼';
        document.getElementById('otpVerifyBox').classList.remove('hidden');
        alert(res.message);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '寄送 6 位數驗證碼';
        showAuthError(err.message);
      })
      .requestEmailOtp(email);
  }

  function handleVerifyOtp() {
    const email = document.getElementById('otpEmail').value.trim();
    const code = document.getElementById('otpCode').value.trim();
    const btn = document.getElementById('verifyOtpBtn');
    btn.disabled = true;
    hideAuthError();

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        sessionStorage.setItem(SESSION_KEY, res.sessionToken);
        loadInitData();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        showAuthError(err.message);
      })
      .verifyEmailOtp(email, code);
  }

  function logoutSession() {
    sessionStorage.removeItem(SESSION_KEY);
    appState.user = null;
    appState.viewMode = 'auto';
    onInitSuccess({
      authenticated: false,
      authRelayUrl: appState.authRelayUrl
    });
  }

  function showAuthError(msg) {
    const box = document.getElementById('authErrorBox');
    box.textContent = msg;
    box.classList.remove('hidden');
  }

  function hideAuthError() {
    document.getElementById('authErrorBox').classList.add('hidden');
  }

  function setupFileEvents() {
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');

    fileInput.addEventListener('change', function (e) {
      handleFilesSelected(e.target.files);
      fileInput.value = '';
    });

    dropZone.addEventListener('dragover', function (e) {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', function () {
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', function (e) {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFilesSelected(e.dataTransfer.files);
    });
  }

  function handleFilesSelected(fileList) {
    Array.from(fileList).forEach(function (file) {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if (!ALLOWED_EXT.has(ext) && !file.type.startsWith('text/')) {
        alert('檔案「' + file.name + '」不是支援的純文字或程式碼格式。');
        return;
      }
      if (file.size > 2 * 1024 * 1024) {
        alert('檔案「' + file.name + '」超過 2MB，請精簡後再上傳。');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (evt) {
        let text = String(evt.target.result || '');
        if (text.indexOf('\u0000') !== -1) {
          alert('檔案「' + file.name + '」偵測到二進位內容，無法以純文字方式儲存。');
          return;
        }
        if (ext === 'ipynb') {
          text = sanitizeIpynbText(text);
        }
        appState.selectedFiles.push({ name: file.name, content: text });
        renderSelectedFiles();
      };
      reader.readAsText(file, 'UTF-8');
    });
  }

  // 針對 Jupyter Notebook (.ipynb) 移除過大的圖片 Base64 輸出，保留所有程式碼與文字
  function sanitizeIpynbText(rawText) {
    try {
      const nb = JSON.parse(rawText);
      if (Array.isArray(nb.cells)) {
        nb.cells.forEach(function (cell) {
          if (Array.isArray(cell.outputs)) {
            cell.outputs.forEach(function (out) {
              if (out.data) {
                Object.keys(out.data).forEach(function (mime) {
                  if (mime.indexOf('image/') === 0) {
                    out.data[mime] = '[已略過內嵌圖片 Base64 以符合試算表儲存限制]';
                  }
                });
              }
            });
          }
        });
      }
      return JSON.stringify(nb, null, 2);
    } catch (e) {
      return rawText;
    }
  }

  function renderSelectedFiles() {
    const el = document.getElementById('selectedFilesList');
    el.innerHTML = appState.selectedFiles.map(function (f, idx) {
      return '<div class="file-item">' +
        '<span>' + escapeHtml(f.name) + ' <span class="muted">(' + f.content.length + ' 字元)</span></span>' +
        '<button class="btn btn-secondary btn-sm" onclick="removeSelectedFile(' + idx + ')">移除</button>' +
        '</div>';
    }).join('');
  }

  function removeSelectedFile(idx) {
    appState.selectedFiles.splice(idx, 1);
    renderSelectedFiles();
  }

  function stars(n) {
    const k = Math.max(1, Math.min(5, Number(n) || 1));
    return '★'.repeat(k) + '☆'.repeat(5 - k);
  }

  function badgeIcons(ids) {
    return (ids || []).map(function (id) {
      const b = appState.badgeCatalog.find(function (x) { return x.id === id; });
      return b ? '<span title="' + escapeHtml(b.name) + '">' + b.icon + '</span>' : '';
    }).join(' ');
  }

  function getAssignmentTitle_(assignmentId) {
    const a = appState.assignments.find(function (item) { return item.assignmentId === assignmentId; });
    return a ? a.title : assignmentId;
  }

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? iso : d.toLocaleString('zh-TW', { hour12: false });
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>
