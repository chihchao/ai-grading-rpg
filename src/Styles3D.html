<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  /* ===== 黏土風（Claymorphism）可愛療癒介面 ===== */
  :root {
    --sky-top: #ffe7f1;
    --sky-bottom: #e2f2ff;
    --card: #fffaf4;
    --ink: #4a3f55;
    --muted: #9a8fa6;
    --pink: #ff9fb6;
    --pink-deep: #f27a97;
    --blue: #9fd2ff;
    --yellow: #ffd27d;
    --purple: #c7a8ff;
    --mint: #8fe3cf;
    --peach: #ffb38a;
    --danger: #f06c7f;
    --radius: 26px;
    --clay-shadow:
      10px 12px 24px rgba(150, 120, 180, 0.28),
      inset -6px -6px 12px rgba(120, 90, 150, 0.10),
      inset 6px 6px 12px rgba(255, 255, 255, 0.95);
    --clay-shadow-sm:
      5px 6px 12px rgba(150, 120, 180, 0.25),
      inset -3px -3px 6px rgba(120, 90, 150, 0.12),
      inset 3px 3px 6px rgba(255, 255, 255, 0.9);
    --clay-pressed:
      inset 4px 4px 8px rgba(120, 90, 150, 0.22),
      inset -3px -3px 6px rgba(255, 255, 255, 0.8);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, #fdf1f6 45%, var(--sky-bottom) 100%);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 0.88rem; }

  /* ===== 3D 世界 ===== */
  #world { position: fixed; inset: 0; }
  #world canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .quest-label {
    position: absolute; left: 0; top: 0;
    pointer-events: auto; cursor: pointer;
    border: none; font-family: inherit; color: var(--ink);
    background: var(--card); border-radius: 18px; padding: 6px 12px 7px;
    box-shadow: var(--clay-shadow-sm);
    display: flex; flex-direction: column; align-items: center; gap: 0;
    max-width: 170px; white-space: nowrap;
    transition: box-shadow 0.15s, background 0.15s;
  }
  .quest-label .ql-title { font-size: 0.86rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .quest-label .ql-status { font-size: 0.7rem; color: var(--muted); }
  .quest-label.todo .ql-status { color: #e08a2e; }
  .quest-label.completed .ql-status { color: #3aa982; }
  .quest-label.perfect { background: #fff6d8; }
  .quest-label.perfect .ql-status { color: #c98f00; }
  .quest-label.closed { opacity: 0.6; }
  .quest-label.hovered { background: #fff; transform-origin: bottom center; }
  .quest-label::after {
    content: ''; position: absolute; bottom: -6px; left: 50%; margin-left: -6px;
    border: 6px solid transparent; border-top-color: var(--card); border-bottom: 0;
  }
  .quest-label.perfect::after { border-top-color: #fff6d8; }

  /* ===== 黏土卡片與按鈕 ===== */
  .clay {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--clay-shadow);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit; font-size: 0.95rem; font-weight: 700; color: var(--ink);
    padding: 10px 18px; border: none; border-radius: 999px; cursor: pointer;
    background: var(--card); box-shadow: var(--clay-shadow-sm);
    transition: transform 0.1s, box-shadow 0.1s; text-decoration: none;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(1px) scale(0.98); box-shadow: var(--clay-pressed); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary { background: var(--pink); color: #fff; text-shadow: 0 1px 0 rgba(200, 80, 110, 0.4); }
  .btn-blue { background: var(--blue); }
  .btn-yellow { background: var(--yellow); }
  .btn-mint { background: var(--mint); }
  .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
  .btn-icon { width: 44px; height: 44px; padding: 0; font-size: 1.25rem; }
  .btn-link { background: none; border: none; color: var(--pink-deep); cursor: pointer; padding: 0; font-family: inherit; font-size: 0.82rem; }

  label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.92rem; }
  input[type="text"], input[type="email"], textarea, select {
    width: 100%; font-family: inherit; font-size: 0.95rem; color: var(--ink);
    padding: 11px 14px; border: none; border-radius: 18px; background: #fff;
    box-shadow: inset 3px 3px 7px rgba(150, 120, 180, 0.2), inset -3px -3px 6px rgba(255, 255, 255, 0.9);
    outline: none;
  }
  input:focus, textarea:focus { box-shadow: inset 3px 3px 7px rgba(150, 120, 180, 0.2), 0 0 0 3px rgba(255, 159, 182, 0.45); }
  textarea { min-height: 120px; resize: vertical; }
  .form-group { margin-bottom: 14px; }

  .chip {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
    background: #f4eefb; color: #7a6a8c;
  }
  .chip-main { background: #efe6ff; color: #7b5cc7; }
  .chip-side { background: #e0f2ff; color: #3e86b8; }
  .chip-open { background: #e2f8ef; color: #2f9a74; }
  .chip-closed { background: #ffe5ea; color: #c4566b; }
  .chip-gold { background: #fff1c7; color: #b07d00; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .stars { color: #f5b301; letter-spacing: 1px; }
  .xp-tag { color: #e0942b; font-weight: 700; }

  .alert { padding: 12px 16px; border-radius: 18px; margin-bottom: 14px; font-size: 0.9rem; }
  .alert-warn { background: #fff4d6; color: #8a6400; }
  .alert-error { background: #ffe3e8; color: #b0405a; }

  /* ===== 載入與登入 ===== */
  .center-card {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(440px, calc(100vw - 32px)); padding: 28px; z-index: 50;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .center-card h2 { margin: 0 0 6px; }
  .bouncy { display: flex; gap: 10px; justify-content: center; margin: 18px 0 8px; }
  .bouncy span {
    width: 18px; height: 18px; border-radius: 50%; display: block;
    box-shadow: var(--clay-shadow-sm); animation: bounce 1s infinite ease-in-out;
  }
  .bouncy span:nth-child(1) { background: var(--pink); }
  .bouncy span:nth-child(2) { background: var(--yellow); animation-delay: 0.15s; }
  .bouncy span:nth-child(3) { background: var(--blue); animation-delay: 0.3s; }
  @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1, 1); } 40% { transform: translateY(-14px) scale(0.95, 1.08); } 60% { transform: translateY(0) scale(1.12, 0.88); } }

  /* ===== HUD ===== */
  .hud-player {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    padding: 14px 18px; display: flex; gap: 14px; align-items: center;
    width: min(360px, calc(100vw - 32px));
  }
  .hud-avatar {
    width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0;
    background: #ffe3d3; box-shadow: var(--clay-shadow-sm);
    display: flex; align-items: center; justify-content: center; font-size: 1.9rem; cursor: pointer;
  }
  .hud-info { flex: 1; min-width: 0; }
  .hud-name { font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-level { display: inline-block; background: var(--yellow); border-radius: 999px; padding: 0 9px; font-weight: 800; font-size: 0.8rem; margin-right: 4px; box-shadow: var(--clay-shadow-sm); }
  .hud-title { font-size: 0.82rem; color: #8b6fbf; font-weight: 700; }
  .xp-bar { height: 12px; border-radius: 999px; background: #f1e9f6; margin-top: 7px; overflow: hidden; box-shadow: inset 2px 2px 4px rgba(150, 120, 180, 0.25); }
  .xp-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffc46b, #ff9fb6); transition: width 0.8s cubic-bezier(.34,1.56,.64,1); }
  .xp-text { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

  .hud-menu {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 400px);
  }
  .hud-menu .btn { padding: 9px 14px; }
  .hud-hint {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 15;
    padding: 8px 18px; font-size: 0.85rem; color: var(--muted); white-space: nowrap; border-radius: 999px;
  }
  /* ===== 虛擬搖桿（觸控裝置） ===== */
  .joystick {
    position: fixed; left: 22px; bottom: 28px; z-index: 18;
    width: 124px; height: 124px; border-radius: 50%;
    background: rgba(255, 250, 244, 0.55);
    box-shadow: var(--clay-shadow-sm);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    touch-action: none; user-select: none; -webkit-user-select: none;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .joystick.active { background: rgba(255, 250, 244, 0.8); }
  .joystick-knob {
    width: 54px; height: 54px; border-radius: 50%; pointer-events: none;
    background: linear-gradient(145deg, #ffc2d1, var(--pink));
    box-shadow: var(--clay-shadow-sm);
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .joystick.active .joystick-knob { transition: none; }
  .toast {
    position: fixed; top: 96px; left: 50%; transform: translateX(-50%); z-index: 30;
    padding: 10px 18px; max-width: calc(100vw - 32px);
  }

  @media (max-width: 860px) {
    .hud-menu {
      top: auto; bottom: 10px; left: 0; right: 0; max-width: none;
      flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding: 8px 12px 12px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .hud-menu::-webkit-scrollbar { display: none; }
    .quest-label { padding: 4px 9px 5px; border-radius: 14px; }
    .quest-label .ql-title { font-size: 0.74rem; max-width: 110px; }
    .quest-label .ql-status { font-size: 0.62rem; }
    .hud-menu .btn { flex-shrink: 0; padding: 8px 12px; font-size: 0.85rem; }
    .hud-hint { display: none; }
    .joystick { bottom: 84px; left: 16px; width: 112px; height: 112px; } /* 避開底部選單列 */
    .hud-player { padding: 10px 14px; }
    .hud-avatar { width: 48px; height: 48px; font-size: 1.6rem; }
  }

  /* ===== 側邊面板 ===== */
  .sheet {
    position: fixed; top: 16px; right: 16px; bottom: 16px; z-index: 40;
    width: min(460px, calc(100vw - 32px));
    display: flex; flex-direction: column; overflow: hidden;
    transform: translateX(calc(100% + 40px)); transition: transform 0.35s cubic-bezier(.34,1.3,.64,1);
  }
  .sheet.open { transform: translateX(0); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 8px; gap: 10px; }
  .sheet-head h2 { margin: 0; font-size: 1.25rem; }
  .sheet-body { padding: 8px 20px 24px; overflow-y: auto; flex: 1; }
  .section { background: #fff; border-radius: 20px; padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--clay-shadow-sm); }
  .section h3 { margin: 0 0 8px; font-size: 1rem; }
  .pre-wrap { white-space: pre-wrap; }

  @media (max-width: 860px) {
    .sheet { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 82vh; transform: translateY(calc(100% + 30px)); }
    .sheet.open { transform: translateY(0); }
  }

  /* 檔案上傳 */
  .drop-zone {
    border-radius: 20px; padding: 16px; text-align: center; cursor: pointer; font-size: 0.9rem;
    background: #fdf7ff; border: 2px dashed #d8c6ee; transition: background 0.2s, border-color 0.2s;
  }
  .drop-zone.dragover { background: #fff0f5; border-color: var(--pink); }
  .file-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .file-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: #f7f1fc; padding: 6px 8px 6px 14px; border-radius: 14px; font-size: 0.85rem;
  }
  /* Shared.html 的 renderSelectedFiles 會用到 btn-secondary */
  .btn-secondary { background: #f1e9f6; }

  /* 成績、能力 */
  .score-big { font-size: 2.4rem; font-weight: 800; color: var(--pink-deep); line-height: 1.1; }
  .comp-row { display: grid; grid-template-columns: 96px 1fr 36px; gap: 8px; align-items: center; font-size: 0.86rem; margin-top: 6px; }
  .comp-row span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comp-track { height: 10px; border-radius: 999px; background: #f1e9f6; overflow: hidden; box-shadow: inset 2px 2px 4px rgba(150, 120, 180, 0.2); }
  .comp-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--purple)); }
  .mentor-box {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; margin: 12px 0;
    background: #efe6ff; border-radius: 20px; box-shadow: var(--clay-shadow-sm);
  }
  .mentor-box .icon { font-size: 2rem; line-height: 1; }
  .mentor-box p { margin: 0; white-space: pre-wrap; }
  .history-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: #fff; border-radius: 18px; padding: 10px 14px; margin-bottom: 8px; box-shadow: var(--clay-shadow-sm);
  }
  .radar-wrap { text-align: center; }
  .radar-wrap svg { width: 100%; max-width: 320px; height: auto; }

  /* 徽章 */
  .badge-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
  .badge-tile { background: #fff; border-radius: 22px; padding: 14px 10px; text-align: center; box-shadow: var(--clay-shadow-sm); }
  .badge-tile .icon { font-size: 2.3rem; }
  .badge-tile strong { display: block; font-size: 0.92rem; }
  .badge-tile.locked { filter: grayscale(1); opacity: 0.45; }
  .badge-tile.unlocked { background: #fff8e1; }

  /* 排行榜 */
  .rank-row {
    display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center;
    background: #fff; border-radius: 18px; padding: 10px 14px; margin-bottom: 8px; box-shadow: var(--clay-shadow-sm);
  }
  .rank-row.me { background: #ffeef3; }
  .rank-no { font-size: 1.2rem; font-weight: 800; text-align: center; }

  /* 任務清單 */
  .quest-item { cursor: pointer; }
  .quest-item:hover { background: #fff6fa; }

  /* 結算 / 詳情 Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(90, 70, 110, 0.35); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px 22px 26px; animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .result-hero { text-align: center; padding: 6px 0 10px; }
  .result-xp { font-size: 2rem; font-weight: 800; color: #e0942b; }
  .level-up {
    display: inline-block; margin: 8px 0; padding: 6px 18px; border-radius: 999px; font-weight: 800;
    background: linear-gradient(90deg, var(--yellow), var(--pink)); box-shadow: var(--clay-shadow-sm);
    animation: wiggle 0.9s ease 0.2s 2;
  }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg) scale(1.06); } 75% { transform: rotate(4deg) scale(1.06); } }
  .delta-up { color: #2f9a74; font-weight: 800; }
  .delta-down { color: var(--danger); font-weight: 800; }
  .pre-box {
    background: #f7f1fc; border-radius: 16px; padding: 12px; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.82rem; max-height: 260px; overflow: auto;
  }
</style>
